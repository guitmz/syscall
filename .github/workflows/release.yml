name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.x"
      - run: ./scripts/package-release.sh "${{ github.ref_name }}" dist
      - uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
      - name: Update Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          git clone "https://x-access-token:${TOKEN}@github.com/guitmz/homebrew-tools.git" tap
          ./scripts/brew-formula.sh "$VERSION" dist/SHA256SUMS > tap/syscall.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add syscall.rb
          git diff --cached --quiet || git commit -m "syscall $VERSION"
          git push
